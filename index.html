<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>당뇨병 예측 및 AI 상담 시스템</title>
    <style>
        :root {
            --primary-color: #4a90e2;
            --secondary-color: #f5f7fa;
            --accent-color: #e74c3c;
            --text-color: #333;
            --border-radius: 8px;
        }

        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            background-color: var(--secondary-color);
            color: var(--text-color);
            line-height: 1.6;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr 1.5fr;
            gap: 20px;
        }

        @media (max-width: 768px) {
            .container {
                grid-template-columns: 1fr;
            }
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: var(--border-radius);
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }

        h1, h2 {
            color: var(--primary-color);
            margin-top: 0;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            font-size: 0.9em;
        }

        input {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 10px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.3s;
        }

        button:hover {
            background-color: #357abd;
        }

        .result-box {
            display: none;
            margin-top: 20px;
            padding: 15px;
            border-radius: var(--border-radius);
            text-align: center;
        }

        .result-high {
            background-color: #ffdce0;
            border: 1px solid var(--accent-color);
        }

        .result-low {
            background-color: #e3f2fd;
            border: 1px solid var(--primary-color);
        }

        .chat-container {
            height: 400px;
            display: flex;
            flex-direction: column;
        }

        #chat-history {
            flex-grow: 1;
            overflow-y: auto;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            margin-bottom: 10px;
            background: #fafafa;
        }

        .message {
            margin-bottom: 10px;
            padding: 8px 12px;
            border-radius: 15px;
            max-width: 80%;
        }

        .user-message {
            align-self: flex-end;
            background-color: var(--primary-color);
            color: white;
            margin-left: auto;
        }

        .ai-message {
            align-self: flex-start;
            background-color: #eee;
            color: var(--text-color);
        }

        .chat-input-group {
            display: flex;
            gap: 10px;
        }

        #chat-input {
            flex-grow: 1;
        }

        .loading {
            opacity: 0.5;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <header style="text-align: center; margin-bottom: 30px;">
        <h1>🏥 당뇨병 AI 예측 및 상담 시스템</h1>
        <p>기본 정보를 입력하여 당뇨병 위험도를 확인하고 AI 상담사에게 질문하세요.</p>
    </header>

    <div class="container">
        <!-- 입력 폼 -->
        <section class="card">
            <h2>데이터 입력</h2>
            <form id="predict-form">
                <div class="form-group">
                    <label>임신 횟수</label>
                    <input type="number" id="pregnancies" value="2" min="0">
                </div>
                <div class="form-group">
                    <label>공복 혈당 (mg/dL)</label>
                    <input type="number" id="glucose" value="130" min="0">
                </div>
                <div class="form-group">
                    <label>혈압 (mmHg)</label>
                    <input type="number" id="blood_pressure" value="70" min="0">
                </div>
                <div class="form-group">
                    <label>피부 두께 (mm)</label>
                    <input type="number" id="skin_thickness" value="20" min="0">
                </div>
                <div class="form-group">
                    <label>인슐린 (mu U/ml)</label>
                    <input type="number" id="insulin" value="80" min="0">
                </div>
                <div class="form-group">
                    <label>BMI (kg/m²)</label>
                    <input type="number" id="bmi" value="25.5" step="0.1" min="0">
                </div>
                <div class="form-group">
                    <label>당뇨 가족력 지수</label>
                    <input type="number" id="diabetes_pedigree" value="0.45" step="0.01" min="0">
                </div>
                <div class="form-group">
                    <label>나이</label>
                    <input type="number" id="age" value="35" min="0">
                </div>
                <button type="submit" id="predict-btn">위험도 예측하기</button>
            </form>

            <div id="result-box" class="result-box">
                <h3 id="risk-level"></h3>
                <p>위험도: <span id="risk-percent"></span>%</p>
            </div>
        </section>

        <!-- AI 상담창 -->
        <section class="card">
            <h2>AI 건강 상담</h2>
            <div class="chat-container">
                <div id="chat-history">
                    <div class="message ai-message">위험도 예측을 먼저 완료한 후 궁금한 점을 질문해 주세요!</div>
                </div>
                <div class="chat-input-group">
                    <input type="text" id="chat-input" placeholder="여기에 질문을 입력하세요..." disabled>
                    <button id="chat-send-btn" style="width: 80px;" disabled>전송</button>
                </div>
                <p id="token-info" style="font-size: 0.8em; color: #888; margin-top: 10px;"></p>
            </div>
        </section>
    </div>

    <script>
        const API_BASE_URL = '';
        let currentPrediction = null;

        // 1. 예측 기능
        document.getElementById('predict-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('predict-btn');
            btn.classList.add('loading');
            btn.textContent = '계산 중...';

            const data = {
                pregnancies: parseInt(document.getElementById('pregnancies').value),
                glucose: parseFloat(document.getElementById('glucose').value),
                blood_pressure: parseFloat(document.getElementById('blood_pressure').value),
                skin_thickness: parseFloat(document.getElementById('skin_thickness').value),
                insulin: parseFloat(document.getElementById('insulin').value),
                bmi: parseFloat(document.getElementById('bmi').value),
                diabetes_pedigree: parseFloat(document.getElementById('diabetes_pedigree').value),
                age: parseInt(document.getElementById('age').value)
            };

            try {
                const response = await fetch(`${API_BASE_URL}/predict`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                
                const result = await response.json();
                currentPrediction = result;

                // UI 업데이트
                const resultBox = document.getElementById('result-box');
                const riskLevel = document.getElementById('risk-level');
                const riskPercent = document.getElementById('risk-percent');

                resultBox.style.display = 'block';
                resultBox.className = 'result-box ' + (result.is_diabetes ? 'result-high' : 'result-low');
                riskLevel.textContent = result.risk_level;
                riskPercent.textContent = result.diabetes_risk_percent;

                // 채팅 활성화
                document.getElementById('chat-input').disabled = false;
                document.getElementById('chat-send-btn').disabled = false;
                addChatMessage('ai', `분석이 완료되었습니다. 위험도는 ${result.diabetes_risk_percent}% (${result.risk_level})입니다. 무엇을 도와드릴까요?`);

            } catch (error) {
                alert('서버 연결에 실패했습니다. API 서버가 구동 중인지 확인하세요.');
                console.error(error);
            } finally {
                btn.classList.remove('loading');
                btn.textContent = '위험도 예측하기';
            }
        });

        // 2. 채팅 기능
        async function sendChatMessage() {
            const input = document.getElementById('chat-input');
            const message = input.value.trim();
            if (!message || !currentPrediction) return;

            addChatMessage('user', message);
            input.value = '';
            
            const sendBtn = document.getElementById('chat-send-btn');
            sendBtn.disabled = true;

            try {
                const response = await fetch(`${API_BASE_URL}/chat`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        prediction_result: currentPrediction,
                        user_message: message
                    })
                });

                const data = await response.json();
                if (response.ok) {
                    addChatMessage('ai', data.ai_response);
                    document.getElementById('token-info').textContent = `사용된 토큰: ${data.tokens_used} (누적: ${data.cumulative_tokens})`;
                } else {
                    addChatMessage('ai', `에러: ${data.detail}`);
                }
            } catch (error) {
                addChatMessage('ai', '서버 통신 중 오류가 발생했습니다.');
            } finally {
                sendBtn.disabled = false;
            }
        }

        document.getElementById('chat-send-btn').addEventListener('click', sendChatMessage);
        document.getElementById('chat-input').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendChatMessage();
        });

        function addChatMessage(role, text) {
            const history = document.getElementById('chat-history');
            const div = document.createElement('div');
            div.className = `message ${role === 'user' ? 'user-message' : 'ai-message'}`;
            div.textContent = text;
            history.appendChild(div);
            history.scrollTop = history.scrollHeight;
        }
    </script>
</body>
</html>
